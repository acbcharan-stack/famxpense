<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Savings & Investments — Family Expense Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <div class="topbar">
    <div style="display:flex; align-items:center; gap:10px;">
      <a class="icon-btn" href="index.html" title="Back to expenses">←</a>
      <h1>💰 Savings & Investments</h1>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
  </div>

  <div class="section-title">Projected value</div>
  <div class="stat-row" id="investStatRow"></div>
  <div class="invest-custom-row">
    <label for="investCustomYears">Projected value in</label>
    <input type="number" id="investCustomYears" min="1" max="60" value="15" />
    <label for="investCustomYears">years</label>
    <strong id="investCustomValue">₹0</strong>
  </div>

  <div class="section-title">Your investments</div>
  <div class="invest-list" id="investList"><div class="empty-note">Loading…</div></div>

</div>

<button class="fab" id="fabAdd" title="Add investment">+</button>

<div class="modal-overlay" id="investModalOverlay">
  <div class="modal">
    <h2 id="investModalTitle">Add investment</h2>
    <div class="field">
      <label for="iName">Name (optional)</label>
      <input type="text" id="iName" placeholder="e.g. HDFC Flexicap SIP" />
    </div>
    <div class="field">
      <label for="iType">Type</label>
      <input type="text" id="iType" list="investTypeSuggestions" placeholder="e.g. Mutual Fund" />
      <datalist id="investTypeSuggestions">
        <option value="Mutual Fund"></option>
        <option value="Fixed Deposit"></option>
        <option value="Public Provident Fund (PPF)"></option>
        <option value="Stocks"></option>
        <option value="Gold"></option>
        <option value="Real Estate"></option>
        <option value="Recurring Deposit"></option>
        <option value="National Pension System (NPS)"></option>
      </datalist>
    </div>
    <div class="field">
      <label id="investModeLabel">How is this invested?</label>
      <div class="tabs" id="investModeTabs">
        <button type="button" class="tab active" data-mode="lumpsum">Lump sum</button>
        <button type="button" class="tab" data-mode="sip">SIP (Monthly)</button>
      </div>
    </div>

    <div class="field mode-lumpsum">
      <label for="iAmount" id="iAmountLabel">Amount invested</label>
      <input type="number" id="iAmount" min="0" step="0.01" placeholder="0.00" />
    </div>

    <div class="field mode-sip" hidden>
      <label for="iSipAmount">Monthly SIP amount</label>
      <input type="number" id="iSipAmount" min="0.01" step="0.01" placeholder="e.g. 50000" />
    </div>

    <div class="field">
      <label for="iDate" id="iDateLabel">Start date</label>
      <input type="date" id="iDate" />
    </div>

    <div class="field mode-sip" hidden>
      <div id="sipChangesList"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="addSipChangeBtn">+ SIP amount changed on a later date</button>
    </div>

    <div class="field mode-sip" hidden>
      <label for="iSipTopup">Extra amount invested outside the SIP (optional)</label>
      <input type="number" id="iSipTopup" min="0" step="0.01" placeholder="e.g. one-time top-up" />
    </div>

    <div class="field">
      <label for="iReturn">Expected annual return (%)</label>
      <input type="number" id="iReturn" min="0" step="0.1" placeholder="e.g. 12" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="investModalCancel">Cancel</button>
      <button class="btn btn-primary" id="investModalSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <div class="lock-emoji">🔒</div>
    <h2>Family Expense Tracker</h2>
    <p>Enter the family passcode to continue.</p>
    <input type="password" id="lockInput" inputmode="numeric" autocomplete="off" placeholder="Passcode" />
    <button class="btn btn-primary" id="lockSubmit">Unlock</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<script type="module" src="investments.js"></script>
</body>
</html>
